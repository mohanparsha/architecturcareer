<text x="44" y="2152" font-size="20" fill="#1e293b" xml:space="preserve">Notice the attack as it happens: alerts on unusual sign-ins and on</text>
<text x="44" y="2180" font-size="20" fill="#1e293b" xml:space="preserve">new mailbox forwarding rules.</text>
<line x1="44" y1="2202" x2="676" y2="2202" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="butt"/>
<rect x="44" y="2214" width="132" height="34" fill="#047857" rx="17"/>
