<text x="190" y="1978" font-size="20" fill="#475569">acts on links 3 and 4</text>
<text x="44" y="2022" font-size="20" fill="#1e293b" xml:space="preserve">Close the weakness and block the method: phishing-resistant MFA,</text>
<text x="44" y="2050" font-size="20" fill="#1e293b" xml:space="preserve">email filtering, staff training.</text>
