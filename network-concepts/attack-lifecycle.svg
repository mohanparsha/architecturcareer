<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2778" width="720" height="2778" role="img" aria-labelledby="attack-lifecycle-title attack-lifecycle-desc" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif'>
<title id="attack-lifecycle-title">Attack lifecycle: from threat actor to business impact</title>
<desc id="attack-lifecycle-desc">Portrait diagram of the attack lifecycle as a chain of six links, read top to bottom, with one worked example: a phishing email leads to the takeover of a finance clerk's mailbox and then to payment fraud. Link 1, Threat actor: The individual or group posing the threat. Example: A fraud gang that targets the finance teams of mid-sized firms. Link 1 poses link 2. Link 2, Threat: Any circumstance or event with the potential to harm an organisation, its assets or its people. Example: A finance mailbox could be taken over and used for payment fraud. Link 2 targets link 3. Link 3, Vulnerability: A weakness in a system, procedure or control that a threat could exploit. Example: Sign-in needs only a password (no MFA), and staff cannot spot a phishing email. Link 3 is used by link 4. Link 4, Exploit: The technique or code that takes advantage of a vulnerability. Example: A phishing email and a fake sign-in page capture the clerk's password. Link 4 enables link 5. Link 5, Attack or incident: The malicious act itself, which jeopardises confidentiality, integrity or availability. Example: The attacker signs in as the clerk and emails customers new bank details. Link 5 results in link 6. Link 6, Impact: The harm to operations, assets and people that results: the business consequence. Example: A customer pays ₹18 lakh into the fraudster's account. Money and trust are lost. A column beside the chain shows where controls act. Links 1 and 2, the threat actor and the threat, are largely outside your control. Prevent acts on links 3 and 4. Close the weakness and block the method: phishing-resistant MFA, email filtering, staff training. Detect acts on link 5. Notice the attack as it happens: alerts on unusual sign-ins and on new mailbox forwarding rules. Respond acts on link 5. Contain it: revoke the sessions, reset the password, warn customers and the bank. Recover acts on link 6. Restore and make good: recall the payment through the bank, restore the mailbox, fix the gap that was used. A control is a safeguard or countermeasure. The earlier it breaks the chain, the smaller the impact. Definitions follow the NIST glossary (csrc.nist.gov/glossary). Exploit follows the CISA NICCS glossary. Architect U'r Career, Krishna Mohan Parsha. CC BY-NC-SA 4.0. Reviewed November 2026.</desc>
