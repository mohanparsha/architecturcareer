<text x="622" y="1760" font-size="20" fill="#ffffff" text-anchor="middle">Restore,</text>
<text x="622" y="1788" font-size="20" fill="#ffffff" text-anchor="middle">make good</text>
<text x="24" y="1918" font-size="20" fill="#475569" font-weight="700" letter-spacing="1.5">CONTROLS IN THE WORKED EXAMPLE</text>
<rect x="24" y="1934" width="672" height="536" fill="#ffffff" rx="12" stroke="#cbd5e1" stroke-width="1.5"/>
