<text x="46" y="2532" font-size="21" fill="#0b1220" xml:space="preserve"><tspan font-weight="700">A</tspan><tspan font-weight="700"> </tspan><tspan font-weight="700">control</tspan> is a safeguard or countermeasure. The earlier it</text>
