<text x="190" y="2238" font-size="20" fill="#475569">acts on link 5</text>
<text x="44" y="2282" font-size="20" fill="#1e293b" xml:space="preserve">Contain it: revoke the sessions, reset the password, warn customers</text>
<text x="44" y="2310" font-size="20" fill="#1e293b" xml:space="preserve">and the bank.</text>
<line x1="44" y1="2332" x2="676" y2="2332" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="butt"/>
